name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  NG_CLI_ANALYTICS: 'false'

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore locked dependencies and audit NuGet packages
        run: dotnet restore SecureIncidentHub.slnx --locked-mode
      - name: Verify formatting
        run: dotnet format SecureIncidentHub.slnx --no-restore --verify-no-changes
      - name: Build with recommended analyzers and warnings as errors
        run: dotnet build SecureIncidentHub.slnx --no-restore -c Release
      - name: Unit and in-process API integration tests
        run: dotnet test SecureIncidentHub.slnx --no-build --no-restore -c Release

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Install locked dependencies without lifecycle scripts
        run: npm --prefix src/frontend ci --ignore-scripts
      - name: Verify frontend formatting
        run: npm --prefix src/frontend run format:check
      - name: Build with strict TypeScript and template checks
        run: npm --prefix src/frontend run build
      - name: Run stable component test
        run: npm --prefix src/frontend test
      - name: Audit application and development dependencies
        run: npm --prefix src/frontend audit --audit-level=high

  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false
      - name: Validate PowerShell and offline foundation invariants
        shell: pwsh
        run: ./scripts/test-foundation.ps1
      - name: Terraform formatting
        run: terraform -chdir=infra/terraform/environments/lab fmt -check
      - name: Initialize providers without a backend or cloud authentication
        run: terraform -chdir=infra/terraform/environments/lab init -backend=false -input=false -lockfile=readonly
      - name: Terraform validation
        run: terraform -chdir=infra/terraform/environments/lab validate
      - name: Validate Compose placeholders without printing values
        run: docker compose --env-file infra/compose/.env.example -f infra/compose/compose.yaml config --quiet
      - name: Generate ephemeral runner credentials
        id: local-env
        shell: pwsh
        run: ./scripts/new-local-env.ps1
      - name: Validate local images and wait for health checks
        run: docker compose --env-file infra/compose/.env -f infra/compose/compose.yaml up -d --wait --wait-timeout 120
      - name: Remove disposable runner containers and volumes
        if: always() && steps.local-env.outcome == 'success'
        run: docker compose --env-file infra/compose/.env -f infra/compose/compose.yaml down --volumes

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned security tools
        shell: bash
        run: |
          mkdir -p .tools/gitleaks .tools/trivy
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output .tools/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  .tools/gitleaks.tar.gz' | sha256sum --check
          tar -xzf .tools/gitleaks.tar.gz -C .tools/gitleaks
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz \
            --output .tools/trivy.tar.gz
          echo '2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a  .tools/trivy.tar.gz' | sha256sum --check
          tar -xzf .tools/trivy.tar.gz -C .tools/trivy
      - name: Scan complete available Git history for secrets
        run: .tools/gitleaks/gitleaks git . --log-opts=--all --config security/gitleaks.toml --redact
      - name: Scan dependencies and infrastructure configuration
        run: .tools/trivy/trivy filesystem --config security/trivy.yaml --scanners vuln,misconfig .
